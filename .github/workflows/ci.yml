name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Dépendances système (winit sur Linux : X11, Wayland)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libx11-dev libxi-dev \
            libxkbcommon-dev libxrandr-dev libegl1-mesa-dev pkg-config

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatage (rustfmt)
        run: cargo fmt --check

      - name: Lint (clippy, toutes les features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: "Tests (toutes les features : cli, pixels)"
        run: cargo test --all-features

      - name: Build (toutes les features)
        run: cargo build --all-features
